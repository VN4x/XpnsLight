services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    command: serve --http=127.0.0.1:8090 --dir=/pb_data
    volumes:
      - pocketbase_data:/pb_data
    network_mode: host
  # PocketBase is loopback-only; only Caddy is reachable on the tailnet port.

  caddy:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host
    depends_on:
      - pocketbase

volumes:
  pocketbase_data:
  caddy_data:
  caddy_config:
